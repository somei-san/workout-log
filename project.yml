# Xcode のプロジェクトは、このファイルから `xcodegen generate` で生成する。
# 設定は Xcode の画面ではなくここで変える(生成し直すと、画面で変えた設定は消える)。
name: WorkoutLog
options:
  bundleIdPrefix: io.github.somei-san
  deploymentTarget:
    iOS: "18.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.19.7"
targets:
  WorkoutLog:
    type: application
    platform: iOS
    sources:
      - WorkoutLog
    dependencies:
      - package: GRDB
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: 筋トレ記録
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - WorkoutLogTests
        - WorkoutLogUITests
  WorkoutLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      # スナップショットの画像は、テストがファイルの場所から直接読むので、バンドルに入れない
      - path: WorkoutLogUITests
        excludes:
          - "**/__Snapshots__"
    dependencies:
      - target: WorkoutLog
      - package: SnapshotTesting
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        # この設定が無いと、UI テストのターゲットで SnapshotTesting が読む Swift Testing を読めず、ビルドが通らない
        TESTING_FRAMEWORK_MODULE_ALIAS_FLAGS: ""
  WorkoutLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WorkoutLogTests
    dependencies:
      - target: WorkoutLog
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
