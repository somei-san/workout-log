name: test

on:
  push:
    branches: [main]
  pull_request:

# PR は最新の push の結果だけ見ればよいので、前の実行を止める。
# main は push ごとに結果を残したいので、実行ごとに別のグループにして、待っている実行も取り消させない
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 1 台のシミュレーターで全部を回すと時間がかかるので、テストを 4 つのジョブに分けて、別々の runner で同時に回す。
  # テストの時間がどのジョブも 5 分前後になるように分けている。テストを足して偏ったら、分け方を見直す
  test:
    name: test (${{ matrix.name }})
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 記録の操作と通し
            ui: -only-testing:WorkoutLogUITests/RecordTests -only-testing:WorkoutLogUITests/WalkthroughTests
          - name: 見た目のライト・標準
            ui: -only-testing:WorkoutLogUITests/SnapshotTests
          - name: 単体と見た目のダーク・標準とライト・XXXL
            unit: true
            ui: -only-testing:WorkoutLogUITests/DarkSnapshotTests -only-testing:WorkoutLogUITests/LargeTextSnapshotTests
          - name: 種目の操作と見た目のダーク・XXXL
            ui: -only-testing:WorkoutLogUITests/ExerciseTests -only-testing:WorkoutLogUITests/DarkLargeTextSnapshotTests
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Xcode のプロジェクトを作る
        run: |
          brew install xcodegen
          xcodegen generate

      # 依存のパッケージを毎回 GitHub から取ると、5 つのジョブが同時に取るので 8 分ほどかかる。取ったものを残して使い回す。
      # 使い回すときは、ビルドで -skipPackageUpdates を付けて、新しい版が無いかを GitHub に問い合わせない（問い合わせに 5 分かかった）。
      # そのため依存の版は、キャッシュにある版のままになる。project.yml を変えたときに新しい版を取るよう、
      # キーは project.yml だけで決め、前方一致で古いキャッシュを復元させない（restore-keys を付けない）
      - name: 依存のパッケージを使い回す
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}

      # ビルドの結果は同じ iOS のどのシミュレーターでも動くので、ビルドの宛先には、起動を待たずに指せる、
      # runner に入っている iPhone 17 を使う。generic/platform=iOS Simulator にすると、テストに要らない x86_64 向けもビルドする。
      # シミュレーターの起動と同時に進めると、ビルドの中の依存のパッケージの解決が数分待たされるので、
      # ビルドを済ませてから起動する
      - name: ビルドする
        run: >
          xcodebuild build-for-testing
          -project WorkoutLog.xcodeproj -scheme WorkoutLog
          -destination "platform=iOS Simulator,OS=27.0,name=iPhone 17" -derivedDataPath build
          -skipPackageUpdates

      # テストを回すシミュレーターは、スナップショットを手元と同じ条件で比べるため、手元で撮るときと同じスクリプトで
      # iOS 27.0 の iPhone 17 の専用のものを用意する
      # 実験: この後の 10 分間、15 秒ごとに、負荷と、CPU を多く使っているプロセスをファイルに残す
      - name: 計測を始める
        run: |
          nohup bash -c 'for i in $(seq 40); do date +%T; uptime; ps -Aro %cpu,rss,comm | head -13 | sed -E "s#/[^ ]*/##"; sleep 15; done' > "$RUNNER_TEMP/cpu.log" 2>&1 &

      - name: シミュレーターを起動する
        # echo の引数の中のコマンド置換では、スクリプトが失敗しても段階が止まらないので、先に変数に受ける
        run: |
          simulator=$(scripts/vrt-simulator.sh)
          echo "SIMULATOR_ID=$simulator" >> "$GITHUB_ENV"

      # 手元の iOS 27.2 のシミュレーターでは、起動した直後に UI テストのアプリの起動が数分止まって
      # 失敗することがあった。その備えに、先に一度アプリを起動しておく
      - name: アプリを一度起動しておく
        run: |
          set -x
          xcrun simctl install "$SIMULATOR_ID" build/Build/Products/Debug-iphonesimulator/WorkoutLog.app
          xcrun simctl launch "$SIMULATOR_ID" io.github.somei-san.WorkoutLog
          sleep 10
          xcrun simctl terminate "$SIMULATOR_ID" io.github.somei-san.WorkoutLog
          date

      # 単体テストと UI テストの段階は、プロジェクトを開かずに、ビルドが作った xctestrun を指定して回す。
      # プロジェクトを指定すると、テストを回すたびに依存のパッケージの解決をやり直す。
      # xctestrun のファイル名には SDK の版とアーキテクチャが入る。ビルドが作るのは 1 つだけなので、ワイルドカードで指す
      - name: 単体テスト
        if: ${{ matrix.unit }}
        run: >
          xcodebuild test-without-building
          -xctestrun build/Build/Products/*.xctestrun
          -destination "id=$SIMULATOR_ID"
          -only-testing:WorkoutLogTests
          -resultBundlePath results/unit.xcresult

      # 失敗したテストを 1 回だけ回し直す。アプリの起動が止まって落ちたときの備え。
      # 基準の画像が無いスナップショットは、記録せずに失敗させる。記録すると、回し直しで通ってしまうため
      - name: UI テスト
        if: ${{ !cancelled() }}
        # 多くのスナップショットが合わないと、回し直しで時間がかかる。ジョブの上限の時間で打ち切られると
        # テスト結果を残す段階も走らないので、その前に UI テストだけを止める
        timeout-minutes: 25
        env:
          TEST_RUNNER_SNAPSHOT_TESTING_RECORD: never
        run: >
          xcodebuild test-without-building
          -xctestrun build/Build/Products/*.xctestrun
          -destination "id=$SIMULATOR_ID"
          ${{ matrix.ui }}
          -retry-tests-on-failure -test-iterations 2
          -resultBundlePath results/ui.xcresult

      # 実験: 計測の結果をログに出す
      - name: 計測の結果を出す
        if: ${{ always() }}
        run: cat "$RUNNER_TEMP/cpu.log"

      - name: テスト結果を残す
        # 通ったときも残す。CI でだけ、記録の画面で操作のたびにアプリのアニメーションの終わりを 60 秒待つことがあり、
        # 遅くても通るので、残さないと遅くなった回のどの操作で待ったかを調べられない。原因が分かったら、通らなかったときだけに戻す。
        # 上限の時間で止められたときも残すため、always() にする（failure() だけでは走らないことがある）
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-${{ strategy.job-index }}
          path: results/
          retention-days: 3
